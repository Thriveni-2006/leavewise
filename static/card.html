<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeaveWise stop card</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf1;font-family:Hind,system-ui,sans-serif;color:#161a1f;font-size:16px}
.page{max-width:820px;margin:16px auto;background:#fff;border-radius:14px;padding:22px;border:1px solid #d3d9e0}
.head{background:#1b1f24;color:#ffb000;border-radius:12px;padding:16px 20px;font-family:DotGothic16,monospace}
.head .r{display:inline-block;background:#ffb000;color:#1b1f24;padding:0 12px;border-radius:6px;font-size:34px;margin-right:12px}
.head .n{font-size:20px}.sub{color:#586271;margin:10px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:5px 8px;text-align:center;border-bottom:1px solid #e1e6ec}
th{font-weight:600;font-size:14px;color:#586271}td.h{font-weight:600}
tr.peak td{background:#fdf1d2}
.how{margin-top:14px;color:#586271;font-size:14px}
.bar{display:inline-block;height:10px;background:#2a3037;border-radius:3px;vertical-align:middle}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #d3d9e0;background:#fff;cursor:pointer;margin-top:12px}
@media print{body{background:#fff}.page{border:0;margin:0}button{display:none}}
</style></head><body><div class="page">
<div class="head"><span class="r" id="r"></span><span class="n" id="n"></span></div>
<p class="sub" id="sub"></p>
<div class="cols"><div><h3 style="margin:0 0 6px">Weekday</h3><table id="wd"></table></div><div><h3 style="margin:0 0 6px">Weekend</h3><table id="we"></table></div></div>
<p class="how">How to use: pick the row for the hour you will be at the stop. Add the walk to your own place. The "Plan for" time is built to be enough about 9 times in 10; the validation report shows how often it really was. Highlighted rows are the slowest hours.</p>
<button onclick="window.print()">Print this card</button> <a href="/">Back</a>
</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('r').textContent=q.get('route')||'';
document.getElementById('n').textContent=(q.get('fn')||'')+'  →  '+(q.get('tn')||'');
document.getElementById('sub').textContent='Time from reaching the stop until you get off, including the wait for the bus. Minutes, from real October 2026 bus GPS.';
async function fill(id,dt){
  const u=`/api/card?route_id=${q.get('route_id')}&direction=${q.get('direction')}&from_stop=${q.get('from_stop')}&to_stop=${q.get('to_stop')}&daytype=${dt}`;
  const rows=await (await fetch(u)).json();const mx=Math.max(...rows.map(r=>r.plan));
  const sorted=[...rows].sort((a,b)=>b.plan-a.plan).slice(0,4).map(r=>r.hour);
  document.getElementById(id).innerHTML='<tr><th>At stop</th><th>Usually</th><th>Plan for</th><th></th></tr>'+rows.map(r=>
   `<tr class="${sorted.includes(r.hour)?'peak':''}"><td class="h">${String(r.hour).padStart(2,'0')}:00</td><td>${Math.round(r.typical)}</td><td><b>${Math.round(r.plan)}</b></td><td style="width:70px"><span class="bar" style="width:${r.plan/mx*60}px"></span></td></tr>`).join('');
}
fill('wd','weekday');fill('we','weekend');
</script></body></html>
