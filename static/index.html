<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pahunch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f2f5f3; --card:#ffffff; --ink:#0e1a16; --mut:#55655f; --line:#d8e0dc; --soft:#eaf0ed;
  --brand:#0b6b4f; --brand-d:#084f3b; --brand-t:#dcf0e8; --signal:#f5a800; --signal-t:#fff3d1;
  --ok:#1a7f4b; --mid:#b7791f; --bad:#b83a2e; --focus:#0b5fff; --shadow:0 1px 2px rgba(14,26,22,.06),0 8px 24px rgba(14,26,22,.06);
  --walk:#9db0a8; --wait:#f5a800; --ride:#0b6b4f;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b1411;--card:#13201b;--ink:#edf3f0;--mut:#9db0a8;--line:#27382f;--soft:#1a2a23;--brand:#2bb58a;--brand-d:#1f8f6c;--brand-t:#143528;--signal-t:#3a2c06;--focus:#7aa7ff;--shadow:none;--walk:#51655c;--ride:#2bb58a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mukta,system-ui,"Noto Sans Devanagari",sans-serif;font-size:17px;line-height:1.5}
.brand,h2,h3,.go,.tab,.time,.cv,.vbtn,.when b,.stat b,.ghost,.chipx,.ampm button,.days b,.seg button,.vtxt{font-family:"Baloo 2",Mukta,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 48px}
header.top{flex-wrap:wrap;display:flex;align-items:center;gap:12px;padding:16px 0 14px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand{font-weight:800;font-size:28px;line-height:1}
.brand i{font-style:normal;font-weight:600;color:var(--brand);margin-left:8px;font-size:22px}
.brand small{display:block;font-family:Mukta,sans-serif;font-weight:400;font-size:13px;color:var(--mut);margin-top:3px}
.sp{flex:1}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none}
.ghost:hover{border-color:var(--brand)}
#offrow{white-space:nowrap;font-size:14px;color:var(--brand);background:var(--brand-t);border-radius:999px;padding:4px 12px;font-weight:600}
#offrow a{color:inherit;text-decoration:underline}
@media(max-width:620px){#offrow{order:5;flex-basis:100%;text-align:center}}
.banner{display:none;background:var(--signal-t);color:var(--ink);border:1px solid var(--signal);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:940px){.grid{grid-template-columns:410px 1fr;align-items:start}.left{position:sticky;top:12px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
h2{font-size:24px;margin:0 0 14px;font-weight:800;line-height:1.15}
h3{font-size:16px;margin:0 0 8px;font-weight:700;color:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:0 0 5px;font-weight:600}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);min-height:50px}
input:focus{border-color:var(--brand)}
/* voice first */
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{min-height:58px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 3px 0 var(--brand-d)}
.vbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-d)}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px;margin:14px 0 6px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
/* numbered sections (a real sequence: from, to, when) */
.sec{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.secno{width:30px;height:30px;border-radius:50%;background:var(--brand-t);color:var(--brand);font-weight:800;display:grid;place-items:center;font-family:"Baloo 2",sans-serif;margin-top:2px}
.sec>div:last-child{min-width:0}
.fld{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1.5px solid var(--line);border-radius:12px;margin:4px 0 0;padding:4px;list-style:none;max-height:260px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.sug li{padding:10px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sug li[aria-selected=true],.sug li:hover{background:var(--soft)}
.sug small{color:var(--mut);white-space:nowrap}
.locbtn{margin-top:8px;min-height:42px;width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;cursor:pointer;font-weight:600;color:var(--mut)}
.locbtn:hover{border-color:var(--brand);color:var(--brand)}
.when{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.when button{display:flex;flex-direction:column;align-items:center;padding:8px 2px;min-height:76px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer}
.when button span{font-size:26px;line-height:1.1}.when button b{font-size:15px;line-height:1.2}.when button small{color:var(--mut);font-size:12px}
.when button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}.when button[aria-pressed=true] small{color:#cdeee2}
.days{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:thin}
.days button{flex:0 0 auto;min-width:58px;padding:6px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.days b{font-size:14px}.days small{color:var(--mut);font-size:15px;font-weight:600}
.days button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}.days button[aria-pressed=true] small{color:var(--card)}
.clock{display:flex;max-width:100%;align-items:center;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px}
.cg{display:grid;grid-template-columns:38px 44px 38px;grid-template-rows:auto auto;align-items:center;justify-items:center;gap:0 4px}
.cg button{width:38px;height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:28px;font-weight:700;cursor:pointer;color:var(--ink)}
.cg button:active{background:var(--brand-t)}
.cv{font-size:40px;font-weight:800;line-height:1;text-align:center}
.cg small{grid-column:1/4;color:var(--mut);font-size:12px}
.colon{font-size:36px;font-weight:800;margin-top:-16px}
.ampm{display:flex;gap:8px;flex-basis:100%;justify-content:center;margin-top:6px}
.ampm button{min-height:34px;padding:0 10px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-weight:700;color:var(--ink)}
.ampm button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
details#exact summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-height:42px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.go{width:100%;margin-top:6px;min-height:58px;border:0;border-radius:14px;background:var(--signal);color:#241a00;font-weight:800;font-size:21px;cursor:pointer;box-shadow:0 3px 0 #b87f00}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #b87f00}
.try{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.try button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;color:var(--mut)}
.try button:hover{border-color:var(--brand);color:var(--brand)}
/* result */
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:15px}
.tab[aria-selected=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.board{display:grid;gap:4px}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.small{font-size:14px;color:var(--mut);font-weight:600}
.time{font-size:clamp(60px,13vw,96px);line-height:.95;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--brand)}
.badge{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;font-family:"Baloo 2",sans-serif}
.badge.high{background:var(--brand-t);color:var(--ok)}.badge.medium{background:var(--signal-t);color:var(--mid)}.badge.low{background:#fde8e5;color:var(--bad)}
@media(prefers-color-scheme:dark){.badge.low{background:#3b1814}}
.route-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:18px;font-weight:600}
.chip{background:var(--ink);color:var(--card);padding:1px 10px;border-radius:8px;font-weight:700;font-family:"Baloo 2",sans-serif;font-size:16px;margin-right:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:var(--soft);border-radius:14px;padding:12px 14px}.stat b{font-size:30px;line-height:1.1;display:block}.stat span{font-size:13px;color:var(--mut)}
/* journey ribbon: how the time is spent */
.rib{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;margin-top:6px}
.rib div{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;min-width:6px;overflow:hidden;white-space:nowrap}
.rib .k-walk{background:var(--walk)}.rib .k-wait{background:var(--wait);color:#241a00}.rib .k-ride{background:var(--ride)}
.rib .k-tail{background:repeating-linear-gradient(135deg,var(--signal-t) 0 6px,transparent 6px 12px);border:1.5px dashed var(--signal);color:var(--mid);border-radius:0 10px 10px 0}
.rlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}
.rlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cols{display:grid;gap:20px;margin-top:18px}
@media(min-width:760px){.cols{grid-template-columns:1.1fr .9fr}}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding-bottom:14px;position:relative}
ol.steps li:not(:last-child):before{content:"";position:absolute;left:19px;top:40px;bottom:2px;width:2px;background:var(--line)}
.ic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:19px}
.st b{font-size:18px;font-weight:700;line-height:1.25;display:block}
.st span{display:block;color:var(--mut);font-size:14px}
.st span.chip,.st span.est{display:inline-block;color:inherit}.st span.chip{color:var(--card)}
.est{margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--signal-t);color:var(--mid)!important;font-size:12px;font-weight:700;vertical-align:middle;border:1px solid var(--signal)}
.note{background:var(--signal-t);border:1px solid var(--signal);border-radius:12px;padding:10px 14px;font-size:15px;margin-top:14px}
.facts{color:var(--mut);font-size:14px;margin:6px 0 0}
details.more summary{cursor:pointer;font-weight:700;font-family:"Baloo 2",sans-serif}
.big-say{width:100%;min-height:54px;font-size:20px;margin-top:16px;border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:14px;cursor:pointer;font-weight:700;font-family:"Baloo 2",sans-serif}
.big-say:hover{background:var(--brand);color:#fff}
.hours{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:6px}
.hours div{flex:1;border-radius:3px 3px 0 0;min-height:4px;background:var(--walk)}
.hours div.t0{background:var(--ok)}.hours div.t2{background:var(--bad)}
.hours div.now{outline:3px solid var(--ink);outline-offset:1px}
.hlabel{display:flex;gap:3px;font-size:11px;color:var(--mut)}.hlabel span{flex:1;text-align:center}
.face{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 0;font-size:15px;font-weight:600}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.act .ghost{min-height:44px;display:inline-flex;align-items:center}
.empty{color:var(--mut);margin:0}
.err{background:#fde8e5;color:#7a1e14;border-radius:12px;padding:12px 14px}
#map{height:340px;border-radius:14px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
#map svg{width:100%;height:100%;display:block}
.trust{margin:16px 2px 0;color:var(--mut);font-size:14px}
.how{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:16px}
.how div{background:var(--soft);border-radius:14px;padding:12px;font-size:14px}.how b{display:block;font-family:"Baloo 2",sans-serif;font-size:16px;color:var(--brand)}
@media(max-width:620px){.how{grid-template-columns:1fr}}
@media print{header.top,.left,.act,.tabs,.banner,#map,.big-say{display:none!important}.grid{display:block}.panel{border:0;padding:0;box-shadow:none}}
/* voice overlay */
.vov{position:fixed;inset:0;background:rgba(8,16,13,.88);display:grid;place-items:center;z-index:50;padding:16px}
.vov[hidden]{display:none}
.vcard{background:var(--card);border-radius:22px;padding:26px;max-width:460px;width:100%;text-align:center}
.vmic{font-size:72px;line-height:1}
.vtxt{font-weight:700;font-size:24px;margin-top:10px}
.vheard{font-size:26px;font-weight:600;margin-top:10px;min-height:34px;color:var(--mut)}
.vbtns[hidden]{display:none}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.vbtns button{min-height:84px;font-size:46px;border:0;border-radius:18px;cursor:pointer;color:#fff}
.vyes{background:var(--ok)}.vno{background:var(--bad)}
@media(prefers-reduced-motion:no-preference){.vmic.on{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="mark" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M3 11h18M7 20v-3M17 20v-3"/><circle cx="7.5" cy="14" r=".8" fill="#fff"/><circle cx="16.5" cy="14" r=".8" fill="#fff"/></svg></div>
  <div class="brand"><span>Pahunch<i>पहुँच</i></span><small id="tTag"></small></div>
  <div class="sp"></div>
  <span id="offrow" hidden><span id="offReady"></span> · <a href="#" id="offTog"></a></span>
  <button class="ghost" id="lang" aria-label="Change language">हिंदी</button>
</header>
<div class="banner" id="off"></div>
<main class="grid">
  <section class="left">
    <form class="panel" id="form" autocomplete="off">
      <h2 id="tAsk"></h2>
      <div class="vrow"><button type="button" class="vbtn" id="vHi">🎤 हिंदी में बोलें</button><button type="button" class="vbtn" id="vEn">🎤 Speak English</button></div>
      <div class="or"><span id="tOr"></span></div>

      <div class="sec"><div class="secno">1</div><div>
        <label for="from" id="lFrom"></label>
        <div class="fld"><input id="from" role="combobox" aria-expanded="false" aria-controls="sug-from" required><ul class="sug" id="sug-from" role="listbox" hidden></ul></div>
        <button type="button" class="locbtn" id="loc"></button>
      </div></div>

      <div class="sec"><div class="secno">2</div><div>
        <label for="to" id="lTo"></label>
        <div class="fld"><input id="to" role="combobox" aria-expanded="false" aria-controls="sug-to" required><ul class="sug" id="sug-to" role="listbox" hidden></ul></div>
      </div></div>

      <div class="sec"><div class="secno">3</div><div>
        <label id="lWhen"></label>
        <div class="when" id="when" role="group" aria-label="When">
          <button type="button" data-k="now" aria-pressed="true"><span>🕒</span><b id="wNow"></b></button>
          <button type="button" data-k="8" aria-pressed="false"><span>🌅</span><b id="wM"></b><small>8:00</small></button>
          <button type="button" data-k="13" aria-pressed="false"><span>☀️</span><b id="wA"></b><small>1:00</small></button>
          <button type="button" data-k="18" aria-pressed="false"><span>🌆</span><b id="wE"></b><small>6:00</small></button>
          <button type="button" data-k="22" aria-pressed="false"><span>🌙</span><b id="wN"></b><small>10:00</small></button>
        </div>
        <div class="days" id="dayseg" role="group" aria-label="Day"></div>
        <div class="clock" id="clock" role="group" aria-label="Exact time">
          <div class="cg"><button type="button" data-d="h-" aria-label="Hour minus">−</button><div class="cv" id="cH">9</div><button type="button" data-d="h+" aria-label="Hour plus">+</button><small id="cHl"></small></div>
          <div class="colon">:</div>
          <div class="cg"><button type="button" data-d="m-" aria-label="Minute minus">−</button><div class="cv" id="cM">30</div><button type="button" data-d="m+" aria-label="Minute plus">+</button><small id="cMl"></small></div>
          <div class="ampm"><button type="button" id="cAM" aria-pressed="true">🌅 AM</button><button type="button" id="cPM" aria-pressed="false">🌙 PM</button></div>
        </div>
        <details id="exact"><summary id="exactS"></summary>
          <div class="seg" role="group"><button type="button" id="mArr" aria-pressed="false"></button><button type="button" id="mDep" aria-pressed="true"></button></div>
          <div class="two">
            <div><label for="date" id="lDate"></label><input id="date" type="date" required></div>
            <div><label for="time" id="lTime"></label><input id="time" type="time" value="09:30" required></div>
          </div>
        </details>
      </div></div>

      <button class="go" id="go" type="submit"></button>
      <div class="try" id="try"></div>
    </form>
  </section>
  <section>
    <div class="panel" id="result"><p class="empty" id="tEmpty"></p></div>
    <div class="panel" style="margin-top:20px"><h3 id="tMap"></h3><div id="map" role="img" aria-label="Route map"></div></div>
    <div class="how">
      <div><b id="h1t"></b><span id="h1"></span></div>
      <div><b id="h2t"></b><span id="h2"></span></div>
      <div><b id="h3t"></b><span id="h3"></span></div>
    </div>
    <p class="trust" id="trust"></p>
  </section>
</main>
</div>
<div class="vov" id="vov" hidden role="dialog" aria-modal="true" aria-live="assertive"><div class="vcard">
  <div class="vmic" id="vIcon">🎤</div><div class="vtxt" id="vMsg"></div><div class="vheard" id="vHeard"></div>
  <div class="vbtns" id="vBtns" hidden><button type="button" class="vyes" id="vYes" aria-label="Yes">✔</button><button type="button" class="vno" id="vNo" aria-label="No">✘</button></div>
  <button type="button" class="ghost" id="vCancel" style="margin-top:16px"></button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="/offline.js"></script>
<script>
let USER=null,FORCE_OFF=false,HI=false, STOPS=[], DATA=null, SEL=0, MAP=null, LAYER=null, MODE='arrive_by', EX=[];
const S={
en:{tag:"Reach on time. Know how sure we are.",ask:"Where are you going?",from:"From (stop or place name)",to:"To (stop or place name)",date:"Day",
 arrive:"Reach by",depart:"Leave at",timeA:"Reach by",timeD:"Leave at",go:"Find my bus",
 empty:"Type a stop name, pick a time. You get when to leave, which bus, and how sure we are.",
 leave:"Leave by",reach:"You reach about",safe:"To be safe, plan to reach by",walk:"Walk",wait:"Wait for the bus",ride:"Ride",final:"Walk to your place",change:"Change bus: walk",min:"min",upto:"up to",
 high:"Very reliable",medium:"Fairly reliable",low:"Not sure. Leave extra early.",
 est:"Estimated",estWhy:"No bus-GPS history for this route. Estimated from the timetable and the city's usual slowdown at this hour. We are less sure.",
 tests:"Worked in {n} of 10 tests on days the model had not seen",basis:"Based on {n} similar trips ({b})",

/* ---------- stop-name search (typeahead) ---------- */
async function searchStops(q){
  if(FORCE_OFF&&Offline.ready())return Offline.search(q);
  try{const r=await fetch('/api/search?q='+encodeURIComponent(q));if(!r.ok)throw 0;return await r.json()}
  catch(e){if(Offline.ready())return Offline.search(q);const k=q.toLowerCase();return STOPS.filter(s=>s.name.toLowerCase().includes(k)).slice(0,12)}
}
function suggest(inp,list){
  let items=[],act=-1,timer=null;
  const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1};
  const pick=s=>{inp.value=s.name;inp._sel=s;close()};
  const draw=()=>{
    if(!items.length){list.innerHTML=`<li aria-disabled="true"><small>${t('noRes')}</small></li>`}
    else list.innerHTML=items.map((s,i)=>`<li role="option" data-i="${i}" aria-selected="${i===act}"><span>${esc(s.name)}</span><small>${s.routes!=null?s.routes+' ':''}${s.routes!=null?'🚌':''}</small></li>`).join('');
    list.hidden=false;inp.setAttribute('aria-expanded','true');
    list.querySelectorAll('li[data-i]').forEach(li=>li.onmousedown=e=>{e.preventDefault();pick(items[+li.dataset.i])});
  };
  inp.addEventListener('input',()=>{
    inp._sel=null;clearTimeout(timer);
    if(inp.value.trim().length<2){close();return}
    timer=setTimeout(async()=>{items=await searchStops(inp.value.trim());act=-1;draw()},180);
  });
  inp.addEventListener('keydown',e=>{
    if(list.hidden)return;
    if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(items.length-1,act+1);draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);draw()}
    else if(e.key==='Enter'&&act>=0){e.preventDefault();pick(items[act])}
    else if(e.key==='Escape')close();
  });
  inp.addEventListener('blur',()=>setTimeout(close,120));
}
suggest($('from'),$('sug-from'));suggest($('to'),$('sug-to'));
async function resolve(inp){
  if(inp._sel)return inp._sel;
  const v=inp.value.trim();if(v.length<2)return null;
  const r=await searchStops(v);return r.length?(inp._sel=r[0]):null;
}

/* ---------- answer ---------- */
const ic={walk:'🚶',wait:'⏳',ride:'🚌',final:'🏁',change:'🔁'};
function stepHTML(k,title,sub){return `<li><div class="ic">${ic[k]}</div><div class="st"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div></li>`}
function estTag(l){return l.measured?'':`<span class="est" title="${esc(t('estWhy'))}">${t('est')}</span>`}
function stepsHTML(o){
  const L=o.legs||[o];let h=stepHTML('walk',`${t('walk')} ${dur(o.walk_to_stop_min)}`,`${t('from_s')}: ${esc(L[0].board_stop)}`);
  L.forEach((l,i)=>{
    h+=stepHTML('wait',`${t('wait')}: ${t('upto')} ${dur(l.wait_plan_min)}`,'');
    h+=stepHTML('ride',`<span class="chip">${esc(l.route)}</span> ${fmt(l.ride_typical_min)}–${dur(l.ride_plan_min)} ${estTag(l)}`,`${t('to_s')}: ${esc(l.alight_stop)}`);
    if(i<L.length-1)h+=stepHTML('change',`${t('change')} ${dur(o.transfer_walk_min||2)}`,`${t('from_s')}: ${esc(L[i+1].board_stop)}`);
  });
  return h+stepHTML('final',`${t('final')} ${dur(o.walk_from_stop_min)}`,'');
}
function anyEst(o){return (o.legs||[o]).some(l=>!l.measured)}
/* the journey ribbon: every minute of the trip in one bar, and the margin we add for bad luck as a dashed tail */
function ribbon(o){
  const L=o.legs||[o],S=[{k:'walk',m:o.walk_to_stop_min}];
  L.forEach((l,i)=>{S.push({k:'wait',m:l.wait_typical_min||0});S.push({k:'ride',m:l.ride_typical_min});if(i<L.length-1)S.push({k:'walk',m:o.transfer_walk_min||2})});
  S.push({k:'walk',m:o.walk_from_stop_min});
  const sum=S.reduce((a,x)=>a+x.m,0),tail=Math.max(0,o.door_to_door_plan_min-sum);
  const seg=(k,m,txt)=>`<div class="k-${k}" style="flex:${Math.max(m,.8)}">${m>=4?txt:''}</div>`;
  return `<div class="rib" role="img" aria-label="${t('ribbonT')}">${S.map(x=>seg(x.k,x.m,fmt(x.m))).join('')}${tail>=1?seg('tail',tail,'+'+fmt(tail)):''}</div>
  <div class="rlegend"><span><i style="background:var(--walk)"></i>${t('walk')}</span><span><i style="background:var(--wait)"></i>${t('wait')}</span><span><i style="background:var(--ride)"></i>${t('ride')}</span><span><i style="background:var(--signal-t);border:1px dashed var(--signal)"></i>${t('margin')}</span></div>`;
}
function render(){
  const R=$('result');

function parseTime(raw){
  const s=raw.toLowerCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();
  if(/अभी|abhi|\bnow\b|right now|तुरंत/.test(s))return 'now';
  let ap=/सुबह|subah|morning|\ba ?m\b/.test(s)?'am':/शाम|रात|दोपहर|evening|night|afternoon|\bp ?m\b/.test(s)?'pm':null;

  else if(/साढ़े|साढे|half past/.test(s)&&nums.length){h=nums[0];m=30}
  else if(/सवा|quarter past/.test(s)&&nums.length){h=nums[0];m=15}
  else if(/पौने|quarter to/.test(s)&&nums.length){h=(nums[0]-1)||12;m=45}
  else if(nums.length&&/^\d{3,4}$/.test(String(nums[0]))){const x=String(nums[0]);h=+x.slice(0,-2);m=+x.slice(-2)}
  else if(nums.length){h=nums[0];if(nums.length>1){m=nums[1];if(nums.length>2&&m%10===0&&nums[2]<10)m+=nums[2]}}

    $('from').value=a.name;$('from')._sel=a;$('to').value=b.name;$('to')._sel=b;
    const n=new Date(),p=x=>String(x).padStart(2,'0');
    $('date').value=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;$('time').value=`${p(n.getHours())}:${p(n.getMinutes())}`;
    if(tm==='now'){CHIP='now';applyChip(false)}
    else{CHIP=null;document.querySelectorAll('#when button').forEach(x=>x.setAttribute('aria-pressed',false));
      DAYOFF=tm.tomorrow?1:0;
      $('time').value=pad2(tm.h)+':'+pad2(tm.m);applyChip(false)}
    setV('⏳',t('vSearching'));
    const prev=DATA;$('form').requestSubmit();
    for(let k=0;k<75&&DATA===prev;k++)await sleep(200);
    chk();$('vov').hidden=true;
    if(DATA&&DATA.options&&DATA.options.length)speakAnswer(DATA.options[0]);else await vSay(sp('none'));
  }catch(e){}
  $('vov').hidden=true;
}
$('vHi').onclick=()=>voiceFlow(true);$('vEn').onclick=()=>voiceFlow(false);
$('vCancel').onclick=()=>{VCANCEL=true;try{VREC&&VREC.abort()}catch(_){}speechSynthesis.cancel();$('vov').hidden=true};
function offlinePlan(a,b){
  const pt=x=>{if(x.lat!=null)return x;const f=Offline.stopById(x.id);return f||null};
  const A=pt(a),B=pt(b);if(!A||!B)return null;
  const r=Offline.journeys(A,B,$('date').value,MODE==='arrive_by'?'arrive':'depart',$('time').value);
  return r?{mode:MODE==='arrive_by'?'arrive':'depart',options:r,live_replay:false,offline:true}:null;
}
$('form').onsubmit=async e=>{
  e.preventDefault();
  if(CHIP==='now'){setNow();MODE='depart'}
  const a=await resolve($('from')),b=await resolve($('to'));
  if(!a||!b){$('result').innerHTML=`<div class="err">${t('pick')}</div>`;return}
  $('off').style.display='none';
  const showOff=()=>{const r=offlinePlan(a,b);if(!r)return false;DATA=r;SEL=0;$('off').textContent=t('offMode');$('off').style.display='block';render();return true};
  if(FORCE_OFF&&Offline.ready()&&showOff())return;
  try{
    const f=x=>x.id?`stop:${encodeURIComponent(x.id)}`:`${x.lat},${x.lng}`;
    const key=MODE==='arrive_by'?'arrive_by':'depart';
    const q=`/api/journeys?from=${f(a)}&to=${f(b)}&date=${$('date').value}&${key}=${$('time').value}`;
    const r=await fetch(q);if(!r.ok)throw 0;DATA=await r.json();SEL=0;
    try{localStorage.setItem('pa_last',JSON.stringify(DATA))}catch(_){}
    render();
  }catch(err){
    if(Offline.ready()&&showOff())return;
    let c=null;try{c=JSON.parse(localStorage.getItem('pa_last')||'null')}catch(_){}
    if(c){DATA=c;SEL=0;$('off').textContent=t('off');$('off').style.display='block';render()}
    else $('result').innerHTML=`<div class="err">${t('err')}</div>`;
  }
};
$('lang').onclick=()=>{HI=!HI;labels();if(DATA)render()};
setNow();MODE='depart';$('mDep').setAttribute('aria-pressed',true);$('mArr').setAttribute('aria-pressed',false);
function offUI(){const r=$('offrow');if(!Offline.ready()){r.hidden=true;return}r.hidden=false;$('offReady').textContent='✓ '+t('offReady');$('offTog').textContent=FORCE_OFF?t('backOn'):t('tryOff')}
$('offTog').onclick=e=>{e.preventDefault();FORCE_OFF=!FORCE_OFF;offUI()};
const _lab=labels;labels=function(){_lab();offUI()};
labels();loadStops();loadEx();Offline.load().then(offUI);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
